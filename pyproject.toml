[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "navstack"
version = "0.2.0"
description = "A mobile-robot navigation and control platform: path planning, MuJoCo simulation, control, and reinforcement learning."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Manas Reddy" }]
license = { text = "MIT" }
keywords = [
    "robotics", "path-planning", "navigation", "motion-planning",
    "mujoco", "mpc", "reinforcement-learning", "control",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.4",
]

[project.urls]
Homepage = "https://github.com/Manas-arumalla/Differential-Drive-Path-planners"
Repository = "https://github.com/Manas-arumalla/Differential-Drive-Path-planners"

[project.scripts]
navstack = "navstack.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
sim = ["mujoco>=3.0", "glfw>=2.5", "PySide6>=6.5", "imageio>=2.25"]
control = ["control>=0.9", "cvxpy>=1.3", "sympy>=1.10", "deap>=1.3"]
rl = ["gymnasium>=0.28", "stable-baselines3>=2.0", "opencv-python>=4.5"]
dashboard = ["streamlit>=1.30"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0"]

[tool.setuptools.packages.find]
include = ["navstack*"]

[tool.setuptools.package-data]
navstack = ["py.typed", "balancing/models/*.xml", "balancing/models/*.zip"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
